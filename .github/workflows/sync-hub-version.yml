name: Sync hub version from EOPLite release

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read latest EOPLite version
        id: release
        run: |
          set -euo pipefail
          VERSION=""
          if [ -f eoplite-updates/version.json ]; then
            VERSION="$(jq -r '.version // empty' eoplite-updates/version.json)"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(curl -fsSL -H "User-Agent: EOPLite-Hub-Sync" \
              https://samadfero.github.io/asngdajwk-plugins/eoplite/version.json \
              | jq -r '.version // empty')"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read EOPLite version from eoplite-updates/version.json or public Pages feed"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest EOPLite version: $VERSION"

      - name: Bump runelite.version if needed
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '\n\r' < runelite.version)"
          LATEST="${{ steps.release.outputs.version }}"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Hub already on $LATEST"
            exit 0
          fi
          echo "$LATEST" > runelite.version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runelite.version
          git commit -m "Auto-sync hub version to EOPLite $LATEST"
          git push origin HEAD
