# Builds EOPLite hub plugins and publishes to GitHub Pages when enabled.
#
# Secrets:  EOPLITE_SIGNING_KEY (full eoplite-signing-key.pem)
# Variables: ENABLE_PUBLIC_PAGES = true

name: Build EOPLite Plugin Hub

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: asngdajwk-plugins-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: plugin-hub

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Fetch plugin-hub tooling
        env:
          PACKAGER_URL: https://github.com/runelite/plugin-hub-tooling/releases/download/v1/bundle.tar.zst
        run: |
          set -eux
          curl --location --fail --retry 4 --max-time 120 -o bundle.tar.zst "$PACKAGER_URL"
          tar xf bundle.tar.zst
          ls -la
          ls -la plugin-hub/
          cat plugin-hub/runelite.version

      - uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            ~/.gradle/caches/
            api/
          key: eoplite-hub-deps-${{ hashFiles('plugin-hub/runelite.version', 'bundle.tar.zst') }}

      - name: Prepare API cache
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./prepare.sh

      - name: Prepare plugins directory
        run: |
          mkdir -p plugin-hub/plugins
          # Remove anything that is not a real plugin manifest (no extension)
          find plugin-hub/plugins -type f -name '*.*' -delete
          find plugin-hub/plugins -type f -name '.*' -delete
          ls -la plugin-hub/plugins/

      - name: Package plugins
        env:
          FORCE_BUILD: ALL
          # Required by Packager (non-null). Upload happens in publish-pages, not here.
          REPO_CREDS: "local:local"
          PACKAGE_IS_PR: "false"
        run: |
          set -eux
          export FORCE_BUILD=ALL
          export PACKAGE_COMMIT_RANGE=""
          java -XX:+UseParallelGC -cp package.jar net.runelite.pluginhub.packager.Packager

      - uses: actions/upload-artifact@v4
        with:
          name: manifest_diff
          path: /tmp/manifest_diff
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: /tmp/jars
          retention-days: 1
          if-no-files-found: ignore

  publish-pages:
    needs: build
    if: vars.ENABLE_PUBLIC_PAGES == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Fetch plugin-hub tooling
        env:
          PACKAGER_URL: https://github.com/runelite/plugin-hub-tooling/releases/download/v1/bundle.tar.zst
        run: |
          set -eux
          curl --location --fail --retry 4 --max-time 120 -o bundle.tar.zst "$PACKAGER_URL"
          tar xf bundle.tar.zst

      - uses: actions/download-artifact@v4
        with:
          name: manifest_diff
          path: /tmp/manifest_diff

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: jars
          path: /tmp/jars

      - name: Sign and stage hub files
        env:
          SIGNING_KEY: ${{ secrets.EOPLITE_SIGNING_KEY }}
          REPO_ROOT: file:${{ github.workspace }}/hub-site/
        run: |
          set -eux
          mkdir -p hub-site
          java -XX:+UseParallelGC -cp upload.jar net.runelite.pluginhub.uploader.Uploader
          ls -laR hub-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub-site

      - id: deployment
        uses: actions/deploy-pages@v4
